<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300"
     width="1200" height="300" role="img"
     aria-label="Ravi Shankar - Senior AI Engineer. React · Kotlin · Node · AI Architectures">
  <title>Ravi Shankar - Senior AI Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1714"/>
      <stop offset="55%" stop-color="#171210"/>
      <stop offset="100%" stop-color="#221a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7ddb4" stop-opacity="0"/>
      <stop offset="45%" stop-color="#f7ddb4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f7ddb4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <style><![CDATA[
    .name   { font: 700 52px 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f5ece1; letter-spacing: -0.5px; }
    .role   { font: 400 22px 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #cbbdad; }
    .tag    { font: 500 15px 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f7ddb4; letter-spacing: 0.6px; }
    .stat-value { font: 700 38px 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f5ece1; }
    .stat-label { font: 600 11px 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #cbbdad; letter-spacing: 1.2px; }
    .section { font: 700 12px 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #f7ddb4; letter-spacing: 2.2px; }
    .stamp  { font: 400 12px 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #cbbdad; opacity: 0.65; }

    .pulse { animation: pulse 4s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.22; }
      50%      { stroke-opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  ]]></style>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>

    <!-- subtle wave / pulse line across lower third -->
    <path class="pulse" d="M -20 262 H 28 l 10 -22 l 10 38 l 10 -16 H 148 l 10 -22 l 10 38 l 10 -16 H 268 l 10 -22 l 10 38 l 10 -16 H 388 l 10 -22 l 10 38 l 10 -16 H 508 l 10 -22 l 10 38 l 10 -16 H 628 l 10 -22 l 10 38 l 10 -16 H 748 l 10 -22 l 10 38 l 10 -16 H 868 l 10 -22 l 10 38 l 10 -16 H 988 l 10 -22 l 10 38 l 10 -16 H 1108 l 10 -22 l 10 38 l 10 -16 H 1228 l 10 -22 l 10 38 l 10 -16 H 1220"
          fill="none" stroke="#f7ddb4" stroke-opacity="0.28"
          stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="0" y="297" width="1200" height="3" fill="url(#glow)"/>

    <text class="name" x="60" y="118">Ravi Shankar</text>
    <rect x="62" y="144" width="54" height="3" rx="1.5" fill="#f7ddb4"/>
    <text class="role" x="60" y="176">Senior AI Engineer</text>
    <text class="tag" x="60" y="212">React · Kotlin · Node · AI Architectures</text>

    <line x1="740" y1="62" x2="740" y2="186" stroke="#4a3c31" stroke-width="1"/>
    <text class="section" x="770" y="84">METRICS</text>
    <g>
    <text class="stat-value" x="808" y="142" text-anchor="middle">41</text>
    <text class="stat-label" x="808" y="170" text-anchor="middle">REPOSITORIES</text>
    <text class="stat-value" x="968" y="142" text-anchor="middle">187</text>
    <text class="stat-label" x="968" y="170" text-anchor="middle">CONTRIBUTIONS · 1Y</text>
    <text class="stat-value" x="1108" y="142" text-anchor="middle">157</text>
    <text class="stat-label" x="1108" y="170" text-anchor="middle">COMMITS · 1Y</text>
    </g>

    <text class="stamp" x="1140" y="212" text-anchor="end">updated 22 Oct 2026</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20"
        fill="none" stroke="#4a3c31" stroke-width="1"/>
</svg>
